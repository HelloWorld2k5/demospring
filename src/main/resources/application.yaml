server:
    port: 8080
    servlet:
        context-path: /testspring

spring:
    datasource:
        url: "jdbc:mysql://localhost:3306/testspring"
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true

jwt:
    signerKey: ${JWT_SIGNER_KEY}