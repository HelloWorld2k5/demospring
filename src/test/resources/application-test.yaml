spring:
    # Chạy test ta sẽ chạy db h2 chứ ko dùng mysql vì test phải đc chạy độc lập,
    # chạy được ở bất cứ đâu, ko phụ thuộc vào db bên ngoài
    datasource:
        url: "jdbc:h2:mem:testdb;MODE=MYSQL"
        username: "sa"
        password: "sa"
        driver-class-name: org.h2.Driver
    jpa:
        hibernate:
            ddl-auto: none

jwt:
    signer-key: ${TEST_JWT_SECRET}
    access-token-validity-in-seconds: ${TEST_JWT_AT_VALIDITY}
    refreshable-duration-in-seconds: ${TEST_JWT_RT_DURATION}